name: Deploy Backend to Render

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/render-deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  build:
    name: Build & Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      # Uncomment below steps when linting/tests are available ->
      # - name: Run Linter
      #   run: npm run lint
      #
      # - name: Run Tests
      #   run: npm test

  deploy:
    name: Trigger Render Deploy
    needs: build
    runs-on: ubuntu-latest
    # Only run deploy on push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Call Render Deploy Hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "Error: RENDER_DEPLOY_HOOK_URL secret is not set in GitHub repository."
            echo "Please set it up in GitHub -> Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
          
          echo "Triggering Render Deployment..."
          response=$(curl -s -w "%{http_code}" -X POST "$DEPLOY_HOOK_URL")
          http_code=${response:${#response}-3}
          
          if [ "$http_code" -eq 200 ] || [ "$http_code" -eq 201 ]; then
            echo "Deployment successfully triggered!"
          else
            echo "Failed to trigger deployment. HTTP status code: $http_code"
            exit 1
          fi
